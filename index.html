<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Turbo - Bot de Fútbol</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Contenedor Principal del Chatbot -->
  <main class="chat-container">
    
    <!-- Encabezado del Bot -->
    <header class="chat-header">
      <div class="bot-avatar">⚡</div>
      <div class="bot-info">
        <h1>Turbo</h1>
        <p>Tu asistente apasionado por el fútbol ⚽</p>
      </div>
    </header>

    <!-- Zona de Chat (Boceto: zona-chat) -->
    <section id="zona-chat" class="zona-chat">
      <!-- Los mensajes del bot y del usuario se insertarán dinámicamente aquí -->
    </section>

    <!-- Zona de Opciones (Boceto: zona-opciones) -->
    <section id="zona-opciones" class="zona-opciones">
      <!-- Los botones de opciones o inputs se generarán dinámicamente aquí -->
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
